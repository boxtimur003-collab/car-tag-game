<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Догонялки на Машинках</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Меню и интерфейс -->
    <div id="ui">
        <div class="menu-box" id="menu-main">
            <h1>🏎️ 3D Догонялки: Мега-Карта</h1>
            <p>Аэропорт, Доки, Город и Эстакады</p>
            <button onclick="createRoom()">Создать комнату</button>
            <input type="text" id="room-input" placeholder="Введите код комнаты брата">
            <button onclick="joinRoom()">Подключиться к брату</button>
        </div>
        <div class="menu-box" id="menu-waiting" style="display:none;">
            <h1>Ожидание игрока...</h1>
            <p>Ваш код комнаты:</p>
            <h2 id="my-room-code">Генерация...</h2>
            <p class="hint">Передайте этот код брату для подключения.</p>
        </div>
    </div>

    <div id="hud">Роль: <span id="role-text">ВОДА</span></div>
    <div id="controls-hint">Управление: <b>W A S D</b> — движение | <b>Пробел</b> — дрифт</div>

    <!-- Подключаем библиотеки Three.js (включая GLTFLoader для вашей модели) и PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <!-- Игровые скрипты -->
    <script src="map.js"></script>
    <script src="game.js"></script>
</body>
</html>
