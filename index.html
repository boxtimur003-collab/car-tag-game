<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Догонялки на Машинках</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #111;
            color: #fff;
            user-select: none;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            transition: opacity 0.3s;
        }
        .menu-box {
            background: #222;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,255,200,0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 1px solid #444;
        }
        h1 { margin-top: 0; color: #00ffc4; font-size: 26px; }
        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }
        input { background: #333; color: #fff; text-align: center; border: 1px solid #555; }
        button { background: #00ffc4; color: #111; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #00cca3; transform: scale(1.02); }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border-left: 5px solid #00ffc4;
            display: none;
        }
        #controls-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div class="menu-box" id="menu-main">
            <h1>🏎️ 3D Догонялки</h1>
            <p>Карта: Аэропорт, Доки и Эстакады</p>
            <button onclick="createRoom()">Создать комнату</button>
            <input type="text" id="room-input" placeholder="Введите код комнаты брата">
            <button onclick="joinRoom()">Подключиться к брату</button>
        </div>
        <div class="menu-box" id="menu-waiting" style="display:none;">
            <h1>Ожидание игрока...</h1>
            <p>Ваш код комнаты:</p>
            <h2 id="my-room-code" style="color: #00ffc4; letter-spacing: 2px;">Генерация...</h2>
            <p style="font-size: 13px; color: #aaa;">Передайте этот код брату, чтобы он ввел его на своем ПК.</p>
        </div>
    </div>

    <div id="hud">Роль: <span id="role-text" style="color: #ff4757; font-weight: bold;">ВОДА (Ищет)</span></div>
    <div id="controls-hint">Управление: <b>W A S D</b> — движение | <b>Пробел</b> — дрифт</div>

    <!-- Подключаем Three.js и PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

    <script>
        let scene, camera, renderer;
        let peer, conn;
        let myCar, enemyCar;
        let isHost = false;
        let myRole = 'hider'; // 'seeker' (вода) или 'hider' (убегает)
        let keys = { w: false, a: false, s: false, d: false, space: false };
        
        // Физика машин
        const physics = (car) => {
            car.speed = car.speed || 0;
            car.angle = car.angle || 0;
            let accel = 0.005;
            let friction = 0.98;
            let maxSpeed = 0.4;
            let turnSpeed = 0.03;

            if (keys.w) car.speed += accel;
            if (keys.s) car.speed -= accel;
            
            if (keys.space) {
                friction = 0.995; // Дрифт (меньше трения боком)
                turnSpeed = 0.035;
            }

            car.speed *= friction;
            if (car.speed > maxSpeed) car.speed = maxSpeed;
            if (car.speed < -maxSpeed / 2) car.speed = -maxSpeed / 2;

            if (Math.abs(car.speed) > 0.001) {
                if (keys.a) car.angle += turnSpeed * Math.sign(car.speed);
                if (keys.d) car.angle -= turnSpeed * Math.sign(car.speed);
            }

            car.position.x += Math.sin(car.angle) * car.speed;
            car.position.z += Math.cos(car.angle) * car.speed;
            car.rotation.y = car.angle;

            // Ограничение карты
            car.position.x = Math.max(-140, Math.min(140, car.position.x));
            car.position.z = Math.max(-140, Math.min(140, car.position.z));
        };

        function initGame() {
            document.getElementById('ui').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('controls-hint').style.display = 'block';

            // Сцена
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a2e);
            scene.fog = new THREE.FogExp2(0x1a1a2e, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(50, 100, 50);
            scene.add(dirLight);

            createMap();

            // Создаем машинки (3D модели из примитивов высокого качества)
            myCar = createCar(isHost ? 0xff4757 : 0x2ed573);
            myCar.position.set(isHost ? -20 : 20, 0, 0);
            scene.add(myCar);

            enemyCar = createCar(isHost ? 0x2ed573 : 0xff4757);
            enemyCar.position.set(isHost ? 20 : -20, 0, 0);
            scene.add(enemyCar);

            myRole = isHost ? 'hider' : 'seeker';
            updateRoleUI();

            window.addEventListener('keydown', (e) => handleKey(e, true));
            window.addEventListener('keyup', (e) => handleKey(e, false));

            animate();
        }

        // Создание 3D модели машинки
        function createCar(color) {
            const carGroup = new THREE.Group();
            
            // Корпус
            const bodyGeo = new THREE.BoxGeometry(2, 0.8, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.6;
            carGroup.add(body);

            // Крыша / Кабина
            const cabinGeo = new THREE.BoxGeometry(1.6, 0.6, 2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.2, -0.2);
            carGroup.add(cabin);

            // Колеса
            const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.4, 16);
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111 });
            const positions = [[-1.1, 0.4, 1.3], [1.1, 0.4, 1.3], [-1.1, 0.4, -1.3], [1.1, 0.4, -1.3]];
            positions.forEach(pos => {
                const wheel = new THREE.Mesh(wheelGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(...pos);
                carGroup.add(wheel);
            });

            return carGroup;
        }

        // Большая карта: Аэропорт, Доки, Эстакады, Укромные места
        function createMap() {
            // Земля
            const groundGeo = new THREE.PlaneGeometry(350, 350);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);

            // Зона аэропорта (ВПП и ангары)
            const runwayGeo = new THREE.PlaneGeometry(30, 250);
            const runwayMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const runway = new THREE.Mesh(runwayGeo, runwayMat);
            runway.rotation.x = -Math.PI / 2;
            runway.position.set(-80, 0.1, 0);
            scene.add(runway);

            // Ангары (укромные места)
            for (let i = -100; i <= 100; i += 70) {
                createBuilding(-120, 5, i, 20, 12, 40, 0x555566);
            }

            // Зона доков (контейнеры и склады — отличные места для пряток)
            for (let x = 40; x <= 120; x += 30) {
                for (let z = -80; z <= 80; z += 25) {
                    if (Math.random() > 0.3) {
                        createBuilding(x, 3, z, 12, 6, 18, Math.random() > 0.5 ? 0xcc4444 : 0x4444cc);
                    }
                }
            }

            // Эстакады со съездами (мосты над картой)
            createBridge(0, 0, 150, 20); // Главный мост
            createBridge(-40, 50, 20, 100); // Съезд
        }

        function createBuilding(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        function createBridge(x, z, width, length) {
            // Опорные столбы
            for (let i = -length / 2; i <= length / 2; i += 30) {
                createBuilding(x - width/2 + 2, 4, z + i, 3, 8, 3, 0x777777);
                createBuilding(x + width/2 - 2, 4, z + i, 3, 8, 3, 0x777777);
            }
            // Полотно эстакады
            const bridgeGeo = new THREE.BoxGeometry(width, 1, length);
            const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
            const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
            bridge.position.set(x, 8, z);
            scene.add(bridge);
        }

        function handleKey(e, isDown) {
            if (e.key === 'w' || e.key === 'W' || e.key === 'ц' || e.key === 'Ц') keys.w = isDown;
            if (e.key === 's' || e.key === 'S' || e.key === 'ы' || e.key === 'Ы') keys.s = isDown;
            if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') keys.a = isDown;
            if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') keys.d = isDown;
            if (e.code === 'Space') keys.space = isDown;
        }

        // Сеть через PeerJS (без сервера, бесплатно навсегда)
        function createRoom() {
            isHost = true;
            peer = new Peer();
            peer.on('open', (id) => {
                document.getElementById('menu-main').style.display = 'none';
                document.getElementById('menu-waiting').style.display = 'block';
                document.getElementById('my-room-code').innerText = id;
            });
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                initGame();
            });
        }

        function joinRoom() {
            isHost = false;
            const code = document.getElementById('room-input').value.trim();
            if (!code) return alert('Введите код комнаты!');
            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
                initGame();
            });
        }

        function setupConnection() {
            conn.on('data', (data) => {
                if (data.type === 'sync') {
                    enemyCar.position.x = data.x;
                    enemyCar.position.z = data.z;
                    enemyCar.rotation.y = data.rot;
                    if (data.tagger !== undefined) {
                        myRole = data.tagger ? (isHost ? 'hider' : 'seeker') : (isHost ? 'seeker' : 'hider');
                        updateRoleUI();
                    }
                }
            });
        }

        function updateRoleUI() {
            const roleEl = document.getElementById('role-text');
            if (myRole === 'seeker') {
                roleEl.innerText = 'ВОДА (Догоняй!)';
                roleEl.style.color = '#ff4757';
            } else {
                roleEl.innerText = 'УБЕГАЕШЬ (Прячься!)';
                roleEl.style.color = '#2ed573';
            }
        }

        // Главный игровой цикл
        function animate() {
            requestAnimationFrame(animate);

            if (myCar) {
                physics(myCar);

                // Камера следует за машинкой сзади-сверху
                const targetX = myCar.position.x - Math.sin(myCar.angle) * 12;
                const targetZ = myCar.position.z - Math.cos(myCar.angle) * 12;
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.y = 8;
                camera.position.z += (targetZ - camera.position.z) * 0.1;
                camera.lookAt(myCar.position.x, myCar.position.y + 1, myCar.position.z);

                // Проверка касания (поимки)
                if (conn && conn.open && enemyCar) {
                    const dist = myCar.position.distanceTo(enemyCar.position);
                    if (dist < 3 && myRole === 'seeker') {
                        // Поймал! Меняемся ролями
                        myRole = 'hider';
                        updateRoleUI();
                        alert('Ты поймал брата! Роли поменялись.');
                    }

                    // Отправка данных брату
                    conn.send({
                        type: 'sync',
                        x: myCar.position.x,
                        z: myCar.position.z,
                        rot: myCar.rotation.y,
                        tagger: myRole === 'seeker'
                    });
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
